name: Aksaray Sesi - Somine Canli HLS

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: FFmpeg Kurulumu
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg python3 curl
          ffmpeg -version | head -n 1

      - name: HLS klasoru
        run: |
          mkdir -p hls

      - name: HTTP Sunucusu
        run: |
          cd hls

          python3 -m http.server 8080 \
            --bind 127.0.0.1 \
            > /tmp/http.log 2>&1 &

          echo $! > /tmp/http.pid

          sleep 2

          echo "HTTP sunucusu çalışıyor."

      - name: Cloudflare Quick Tunnel Kur
        run: |
          curl -L --fail \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

          ./cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          echo "Cloudflare tunnel başlatıldı."

          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo "======================================"
              echo " CLOUDFLARE ADRESI"
              echo " $URL"
              echo "======================================"

              echo "## Televizo HLS" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Tunnel:** $URL" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**M3U8:** $URL/aksaray.m3u8" >> "$GITHUB_STEP_SUMMARY"

              break
            fi

            sleep 2
          done

          echo "Cloudflare log:"
          cat /tmp/cloudflared.log

      - name: HLS Yayını Başlat
        run: |
          echo "======================================"
          echo " AKSARAY SESI - SOMINE CANLI HLS"
          echo "======================================"

          timeout --signal=TERM --kill-after=15s 335m \
          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -stream_loop -1 \
            -re \
            -i "https://raw.githubusercontent.com/canahmetdogan-rgb/Aksaray-/refs/heads/main/somine.gif" \
            \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -filter_complex "\
            [0:v]scale=1280:720:force_original_aspect_ratio=decrease,\
            pad=1280:720:(ow-iw)/2:(oh-ih)/2,\
            format=yuv420p[v]" \
            \
            -map "[v]" \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 3.1 \
            -pix_fmt yuv420p \
            -r 25 \
            -b:v 1500k \
            -maxrate 1700k \
            -bufsize 3400k \
            \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 96k \
            -ar 44100 \
            -ac 2 \
            \
            -f hls \
            -hls_time 4 \
            -hls_list_size 6 \
            -hls_flags delete_segments+append_list \
            -hls_segment_filename "hls/segment_%05d.ts" \
            \
            hls/aksaray.m3u8

      - name: Son Kontrol
        if: always()
        run: |
          echo "======================================"
          echo " HLS DOSYALARI"
          echo "======================================"

          ls -lh hls/ || true

          echo
          echo "PLAYLIST:"
          cat hls/aksaray.m3u8 2>/dev/null || true
