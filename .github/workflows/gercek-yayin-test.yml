name: Gercek Yayin Testi - Aksaray Sesi

on:
  workflow_dispatch:

jobs:
  stream-test:
    runs-on: ubuntu-24.04

    steps:
      - name: FFmpeg Kurulumu
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          echo "FFmpeg sürümü:"
          ffmpeg -version | head -n 1

      - name: SSH101 10 Dakika Gerçek Yayın Testi
        env:
          SSH101_KEY: ${{ secrets.SSH101_KEY }}
        run: |
          set +e

          echo "=============================================="
          echo " AKSARAY SESİ + BÜYÜK ÇAMLICA"
          echo " SSH101 GERÇEK YAYIN TESTİ"
          echo "=============================================="
          echo "Video : 1280x720 / 25 FPS / H.264 Main"
          echo "Video : 1500 kbps hedef"
          echo "Ses   : AAC / 44.1 kHz / 96 kbps"
          echo "Süre  : 10 dakika"
          echo "=============================================="

          timeout --signal=TERM --kill-after=15s 600s \
          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 5 \
            \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 3.1 \
            -pix_fmt yuv420p \
            -s 1280x720 \
            -r 25 \
            \
            -b:v 1500k \
            -maxrate 1700k \
            -bufsize 3400k \
            \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 96k \
            -ar 44100 \
            -ac 2 \
            \
            -flvflags no_duration_filesize \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${SSH101_KEY}"

          STATUS=$?

          echo "=============================================="
          echo " FFmpeg çıkış kodu: $STATUS"
          echo "=============================================="

          if [ "$STATUS" -eq 124 ]; then
            echo "10 dakikalık yayın testi başarıyla tamamlandı."
            exit 0
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "FFmpeg normal şekilde tamamlandı."
            exit 0
          fi

          echo "FFmpeg beklenmeyen bir hata ile durdu."
          exit "$STATUS"
