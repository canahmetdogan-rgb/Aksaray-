name: Gercek Yayin Testi - Aksaray Sesi

on:
  workflow_dispatch:

jobs:
  stream-test:
    runs-on: ubuntu-24.04

    steps:
      - name: FFmpeg Kurulumu
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: 10 Dakika Görüntülü Radyo Testi
        env:
          SSH101_KEY: ${{ secrets.SSH101_KEY }}
        run: |
          set +e

          echo "=============================================="
          echo " AKSARAY SESİ - GÖRÜNTÜLÜ RADYO"
          echo " BÜYÜK ÇAMLICA + AKSARAY SESİ"
          echo "=============================================="

          timeout --signal=TERM --kill-after=15s 600s \
          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 5 \
            \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -filter_complex "\
            [0:v]scale=1280:720:force_original_aspect_ratio=decrease,\
            pad=1280:720:(ow-iw)/2:(oh-ih)/2,\
            drawbox=x=25:y=570:w=430:h=115:color=black@0.70:t=fill,\
            drawtext=text='AKSARAY SESI':x=50:y=595:fontsize=34:fontcolor=white,\
            drawtext=text='CANLI RADYO':x=50:y=638:fontsize=25:fontcolor=white,\
            drawtext=text='44.1 kHz  |  AAC':x=50:y=675:fontsize=20:fontcolor=white\
            [v]" \
            \
            -map "[v]" \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 3.1 \
            -pix_fmt yuv420p \
            -r 25 \
            \
            -b:v 1500k \
            -maxrate 1700k \
            -bufsize 3400k \
            \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 96k \
            -ar 44100 \
            -ac 2 \
            \
            -flvflags no_duration_filesize \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${SSH101_KEY}"

          STATUS=$?

          echo "=============================================="
          echo " FFmpeg çıkış kodu: $STATUS"
          echo "=============================================="

          if [ "$STATUS" -eq 124 ]; then
            echo "10 dakikalık görüntülü radyo testi tamamlandı."
            exit 0
          fi

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          exit "$STATUS"
