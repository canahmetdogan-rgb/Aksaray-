name: Gercek Yayin Testi - Aksaray Sesi

on:
  workflow_dispatch:

jobs:
  stream-test:
    runs-on: ubuntu-24.04

    steps:

      - name: FFmpeg kontrol
        run: |
          echo "======================================"
          echo "FFMPEG KONTROL"
          echo "======================================"

          command -v ffmpeg
          ffmpeg -version | head -n 1

          echo "FFmpeg HAZIR"


      - name: SSH101 DNS
        run: |
          echo "======================================"
          echo "SSH101 DNS"
          echo "======================================"

          getent hosts ssh101.bozztv.com

          echo "DNS OK"


      - name: SSH101 TCP 1935
        run: |
          echo "======================================"
          echo "SSH101 TCP TEST"
          echo "======================================"

          timeout 10 bash -c \
          'cat < /dev/null > /dev/tcp/ssh101.bozztv.com/1935'

          echo "TCP 1935 OK"


      - name: Kamera test
        run: |
          echo "======================================"
          echo "KAMERA TEST"
          echo "======================================"

          timeout 30 ffmpeg \
            -hide_banner \
            -loglevel error \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            -t 5 \
            -map 0:v:0 \
            -f null -

          echo "KAMERA OK"


      - name: Aksaray Sesi test
        run: |
          echo "======================================"
          echo "AKSARAY SESI TEST"
          echo "======================================"

          timeout 30 ffmpeg \
            -hide_banner \
            -loglevel error \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            -t 5 \
            -map 0:a:0 \
            -f null -

          echo "AKSARAY SESI OK"


      - name: Gercek yayin
        env:
          SSH101_KEY: ${{ secrets.SSH101_KEY }}

        run: |

          echo "======================================"
          echo "GERCEK YAYIN BASLIYOR"
          echo "======================================"

          timeout 300 ffmpeg \
            -hide_banner \
            -loglevel info \
            -analyzeduration 30M \
            -probesize 50M \
            -fflags +genpts+discardcorrupt \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_at_eof 1 \
            -reconnect_delay_max 5 \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_at_eof 1 \
            -reconnect_delay_max 5 \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -s 1280x720 \
            -r 20 \
            -g 40 \
            -keyint_min 40 \
            -sc_threshold 0 \
            -b:v 1000k \
            -maxrate 1200k \
            -bufsize 2400k \
            \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            \
            -flvflags no_duration_filesize \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${SSH101_KEY}"
