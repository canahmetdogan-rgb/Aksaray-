name: Taksim Kamera + Aksaray Sesi Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:

      - name: FFmpeg Kurulumu
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Taksim Kamera Kontrol
        run: |
          set -e

          echo "======================================"
          echo " TAKSİM KAMERA TESTİ"
          echo "======================================"

          ffprobe \
            -hide_banner \
            -loglevel info \
            -user_agent "Mozilla/5.0" \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/taksim.stream/chunklist_w438961806.m3u8" \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default

      - name: Aksaray Sesi Kontrol
        run: |
          set -e

          echo "======================================"
          echo " AKSARAY SESİ TESTİ"
          echo "======================================"

          ffprobe \
            -hide_banner \
            -loglevel info \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,bit_rate \
            -of default

      - name: Taksim Kamera + Aksaray Sesi
        run: |
          set +e

          echo "======================================"
          echo " TAKSİM KAMERA + AKSARAY SESİ"
          echo " 120 SANİYE TEST"
          echo "======================================"

          timeout --signal=TERM --kill-after=15s 120s \
          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -user_agent "Mozilla/5.0" \
            \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/taksim.stream/chunklist_w438961806.m3u8" \
            \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 3.1 \
            -pix_fmt yuv420p \
            -r 25 \
            -b:v 1500k \
            -maxrate 1700k \
            -bufsize 3400k \
            \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 96k \
            -ar 44100 \
            -ac 2 \
            \
            -t 120 \
            -f null -

          STATUS=$?

          echo
          echo "======================================"
          echo " TEST ÇIKIŞ KODU: $STATUS"
          echo "======================================"

          if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 124 ]; then
            echo
            echo "======================================"
            echo " TAKSİM KAMERA + AKSARAY SESİ BAŞARILI"
            echo "======================================"
            exit 0
          fi

          echo "Kamera veya radyo akışında hata oluştu."
          exit "$STATUS"
