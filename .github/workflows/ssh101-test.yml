name: Somine GIF + Aksaray Sesi HLS

on:
  workflow_dispatch:

jobs:
  hls-test:
    runs-on: ubuntu-24.04

    steps:
      - name: FFmpeg Kurulumu
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: HLS Yayını Oluştur
        run: |
          mkdir -p hls

          timeout --signal=TERM --kill-after=15s 300s \
          ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -stream_loop -1 \
            -re \
            -i "https://raw.githubusercontent.com/canahmetdogan-rgb/Aksaray-/refs/heads/main/somine.gif" \
            \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -filter_complex "\
            [0:v]scale=1280:720:force_original_aspect_ratio=decrease,\
            pad=1280:720:(ow-iw)/2:(oh-ih)/2,\
            format=yuv420p[v]" \
            \
            -map "[v]" \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 3.1 \
            -pix_fmt yuv420p \
            -r 25 \
            -b:v 1500k \
            -maxrate 1700k \
            -bufsize 3400k \
            \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 96k \
            -ar 44100 \
            -ac 2 \
            \
            -f hls \
            -hls_time 4 \
            -hls_list_size 0 \
            -hls_segment_filename "hls/segment_%03d.ts" \
            \
            hls/aksaray.m3u8

          STATUS=$?

          if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 124 ]; then
            echo "HLS üretimi tamamlandı."
            exit 0
          fi

          exit "$STATUS"

      - name: HLS Dosyalarını Kontrol Et
        run: |
          echo "=== HLS PLAYLIST ==="
          cat hls/aksaray.m3u8

          echo
          echo "=== DOSYALAR ==="
          ls -lh hls/

      - name: HLS Dosyalarını Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: aksaray-sesi-hls
          path: hls/
          retention-days: 1
