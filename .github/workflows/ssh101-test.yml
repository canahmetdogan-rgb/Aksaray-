name: Ornek Yayin Analizi

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:

      - name: FFmpeg kurulumu
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1

      - name: TS yayin analizi
        run: |
          echo "======================================"
          echo "ORNEK YAYIN ANALIZI"
          echo "======================================"

          timeout 30 ffmpeg \
            -hide_banner \
            -loglevel info \
            -analyzeduration 10M \
            -probesize 20M \
            -i "http://4.438069.xyz:2086/live/@SeZR.12.11.22/2022xSezER.12.11@/396682.ts" \
            -t 10 \
            -map 0 \
            -f null -

          echo "======================================"
          echo "ANALIZ TAMAMLANDI"
          echo "======================================"
