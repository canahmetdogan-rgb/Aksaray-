name: SSH101 Saf RTMP Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: DNS testi
        run: |
          echo "=== DNS ==="
          getent hosts ssh101.bozztv.com

      - name: Port 1935 testi
        run: |
          echo "=== TCP 1935 ==="

          timeout 10 bash -c \
          'cat < /dev/null > /dev/tcp/ssh101.bozztv.com/1935'

          echo "TCP 1935 BASARILI"

      - name: RTMP handshake testi
        run: |
          echo "=== RTMP SERVER TEST ==="

          timeout 15 ffmpeg \
            -hide_banner \
            -loglevel debug \
            -f lavfi \
            -i "testsrc=size=320x240:rate=5" \
            -t 5 \
            -c:v libx264 \
            -preset ultrafast \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${{ secrets.SSH101_KEY }}" \
            2>&1 | tee rtmp.log

          echo ""
          echo "=== RTMP SONUCU ==="

          grep -Ei \
          "connect|handshake|publish|NetStream|server|error|failed|refused|closed|broken|reset" \
          rtmp.log || true
