name: Resim Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Dosyaları göster
        run: |
          ls -lah
          file image.jpg

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Resmi FFmpeg ile kontrol et
        run: |
          ffmpeg -hide_banner -i image.jpg -f null -
