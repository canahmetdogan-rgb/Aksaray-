name: Aksaray Sesi Video HLS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hls:
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Dosyaları kontrol et
        run: |
          ls -lah
          file video.mp4
          ffprobe -hide_banner video.mp4

      - name: Video + Radyo HLS oluştur
        run: |
          rm -rf docs
          mkdir -p docs

          timeout 90 ffmpeg \
            -stream_loop -1 \
            -i video.mp4 \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 25 \
            -s 1280x720 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f hls \
            -hls_time 6 \
            -hls_list_size 10 \
            -hls_flags delete_segments \
            -t 60 \
            docs/playlist.m3u8

      - name: GitHub Pages'e kaydet
        run: |
          touch docs/.nojekyll
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs
          git commit -m "Video radyo HLS güncelleme" || true
          git push
