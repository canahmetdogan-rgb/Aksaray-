name: Aksaray Sesi Radio Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Radyo bağlantısını test et
        run: |
          timeout 30 ffmpeg \
          -reconnect 1 \
          -reconnect_streamed 1 \
          -reconnect_delay_max 10 \
          -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
          -t 20 \
          -vn \
          -f null -
