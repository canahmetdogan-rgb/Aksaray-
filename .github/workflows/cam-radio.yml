name: Aksaray Sesi - Cam + Radio Test

on:
  workflow_dispatch:

jobs:
  stream-test:
    runs-on: ubuntu-24.04

    steps:
      - name: FFmpeg kurulumu
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          ffmpeg -version

      - name: 5 Dakika Canlı Yayın Testi
        env:
          SSH101_KEY: ${{ secrets.SSH101_KEY }}
        run: |
          set +e

          echo "======================================"
          echo " AKSARAY SESİ + BÜYÜK ÇAMLICA TESTİ"
          echo "======================================"
          echo "Çözünürlük : 1280x720"
          echo "FPS        : 25"
          echo "Video      : H.264 Main / 1500 kbps"
          echo "Ses        : AAC-LC / 44.1 kHz / 96 kbps"
          echo "Süre       : 5 dakika"
          echo "======================================"

          timeout 300s ffmpeg \
            -hide_banner \
            -loglevel info \
            \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 5 \
            \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 3.1 \
            -pix_fmt yuv420p \
            -s 1280x720 \
            -r 25 \
            -b:v 1500k \
            -maxrate 1700k \
            -bufsize 3400k \
            \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            \
            -c:a aac \
            -b:a 96k \
            -ar 44100 \
            -ac 2 \
            \
            -flvflags no_duration_filesize \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${SSH101_KEY}"

          STATUS=$?

          if [ "$STATUS" -eq 124 ]; then
            echo "======================================"
            echo " 5 DAKİKALIK TEST BAŞARIYLA TAMAMLANDI"
            echo "======================================"
            exit 0
          fi

          echo "FFmpeg çıkış kodu: $STATUS"
          exit "$STATUS"
