name: Aksaray Sesi - SSH101 Canli

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:

      - name: FFmpeg kurulumu
        run: |
          echo "======================================"
          echo "FFMPEG KURULUYOR"
          echo "======================================"

          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1


      - name: SSH101 RTMP port testi
        run: |
          echo "======================================"
          echo "SSH101 RTMP PORT TESTI"
          echo "======================================"

          timeout 10 bash -c \
          'cat < /dev/null > /dev/tcp/ssh101.bozztv.com/1935'

          echo "RTMP 1935 PORT ACIK"


      - name: Aksaray Sesi test
        run: |
          echo "======================================"
          echo "AKSARAY SESI TESTI"
          echo "======================================"

          timeout 20 ffmpeg \
            -hide_banner \
            -loglevel info \
            -analyzeduration 10M \
            -probesize 20M \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            -t 10 \
            -map 0:a:0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f null -

          echo "======================================"
          echo "AKSARAY SESI TESTI TAMAMLANDI"
          echo "======================================"


      - name: Kamera test
        run: |
          echo "======================================"
          echo "BUYUK CAMLICA KAMERA TESTI"
          echo "======================================"

          timeout 20 ffmpeg \
            -hide_banner \
            -loglevel info \
            -analyzeduration 10M \
            -probesize 20M \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            -t 10 \
            -map 0:v:0 \
            -c:v copy \
            -f null -

          echo "======================================"
          echo "KAMERA TESTI TAMAMLANDI"
          echo "======================================"


      - name: Kamera + Aksaray Sesi -> SSH101
        env:
          SSH101_KEY: ${{ secrets.SSH101_KEY }}

        run: |

          echo "======================================"
          echo "AKSARAY SESI + BUYUK CAMLICA"
          echo "SSH101 CANLI YAYIN BASLIYOR"
          echo "======================================"

          echo "Video: BUYUK CAMLICA"
          echo "Audio: AKSARAY SESI"
          echo "Video: 1280x720 / 20 FPS"
          echo "Audio: AAC 128K"
          echo "RTMP: SSH101"
          echo "======================================"


          ffmpeg \
            -hide_banner \
            -loglevel verbose \
            -analyzeduration 30M \
            -probesize 50M \
            -fflags +genpts+discardcorrupt \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_at_eof 1 \
            -reconnect_delay_max 5 \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_at_eof 1 \
            -reconnect_delay_max 5 \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -s 1280x720 \
            -r 20 \
            -g 40 \
            -keyint_min 40 \
            -sc_threshold 0 \
            \
            -b:v 1000k \
            -maxrate 1200k \
            -bufsize 2400k \
            \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            \
            -flvflags no_duration_filesize \
            \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${SSH101_KEY}"
