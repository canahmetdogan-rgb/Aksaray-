      - name: Kamera + Aksaray Sesi -> SSH101
        env:
          SSH101_KEY: ${{ secrets.SSH101_KEY }}
        run: |
          echo "=== CANLI YAYIN BASLIYOR ==="
          echo "SSH101 RTMP bağlantısı hazırlanıyor..."

          ffmpeg \
            -hide_banner \
            -loglevel verbose \
            -analyzeduration 30M \
            -probesize 50M \
            -fflags +genpts \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 5 \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 5 \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -s 1280x720 \
            -r 25 \
            -g 50 \
            -keyint_min 50 \
            -sc_threshold 0 \
            \
            -b:v 1000k \
            -maxrate 1200k \
            -bufsize 2400k \
            \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${SSH101_KEY}"
