name: Aksaray Sesi - SSH101 Canli

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:

      - name: FFmpeg kurulumu
        run: |
          echo "FFmpeg kontrol ediliyor..."

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg zaten kurulu."
          else
            echo "FFmpeg bulunamadi, kuruluyor..."
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

          echo "FFmpeg versiyonu:"
          ffmpeg -version | head -n 1


      - name: SSH101 RTMP port testi
        run: |
          echo "SSH101 RTMP port kontrolu..."

          timeout 10 bash -c \
          'cat < /dev/null > /dev/tcp/ssh101.bozztv.com/1935'

          echo "RTMP 1935 PORT ACIK"


      - name: Aksaray Sesi test
        run: |
          echo "Aksaray Sesi test ediliyor..."

          timeout 20 ffmpeg \
            -hide_banner \
            -loglevel info \
            -analyzeduration 10M \
            -probesize 20M \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            -t 10 \
            -map 0:a:0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f null -

          echo "Aksaray Sesi testi tamamlandi."


      - name: Kamera + Aksaray Sesi -> SSH101
        env:
          SSH101_KEY: ${{ secrets.SSH101_KEY }}

        run: |

          echo "======================================"
          echo "CANLI YAYIN BASLIYOR"
          echo "======================================"

          ffmpeg \
            -hide_banner \
            -loglevel debug \
            -analyzeduration 30M \
            -probesize 50M \
            -fflags +genpts+discardcorrupt \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_at_eof 1 \
            -reconnect_delay_max 5 \
            -i "https://kamerayayin.ibb.istanbul/turistikcam/buyukcamlica.stream/chunklist_w607999958.m3u8" \
            \
            -thread_queue_size 4096 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_at_eof 1 \
            -reconnect_delay_max 5 \
            -i "https://sslyayin.netyayin.net/aksarayinsesi/stream/" \
            \
            -map 0:v:0 \
            -map 1:a:0 \
            \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -s 1280x720 \
            -r 20 \
            -g 40 \
            -keyint_min 40 \
            -sc_threshold 0 \
            \
            -b:v 1000k \
            -maxrate 1200k \
            -bufsize 2400k \
            \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            \
            -flvflags no_duration_filesize \
            \
            -f flv \
            -rtmp_live live \
            "rtmp://ssh101.bozztv.com/ssh101/${SSH101_KEY}"
